name: Release

# Main builds are downloadable Actions artifacts; version tags publish a release
# only after every platform has built and passed its checks.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
          - os: windows-latest
            platform: win
          - os: ubuntu-22.04
            platform: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Verify release version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: node -e "if ('v' + require('./package.json').version !== process.env.GITHUB_REF_NAME) process.exit(1)"
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # Pull requests can't read secrets: they get an ad hoc signature, as
      # before. Pushes to main and v* tags are signed with the Developer ID
      # certificate and notarized by Apple.
      - name: Prepare macOS signing
        id: macsign
        if: matrix.platform == 'mac' && github.event_name != 'pull_request'
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          key="$RUNNER_TEMP/AuthKey.p8"
          printf '%s\n' "$APPLE_API_KEY_P8" > "$key"
          chmod 600 "$key"
          echo "api_key=$key" >> "$GITHUB_OUTPUT"
      - name: Build (signed and notarized macOS)
        if: steps.macsign.outcome == 'success'
        env:
          CSC_LINK: ${{ secrets.MAC_CERT_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_API_KEY: ${{ steps.macsign.outputs.api_key }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npm run dist -- --mac --publish never
      - name: Build (ad hoc macOS signature)
        if: matrix.platform == 'mac' && steps.macsign.outcome != 'success'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: >-
          npm run dist -- --mac --publish never
          -c.mac.identity=- -c.mac.hardenedRuntime=false -c.mac.notarize=false
      - name: Build
        if: matrix.platform != 'mac'
        run: npm run dist -- --${{ matrix.platform }} --publish never
      - name: Verify macOS signature and notarization
        if: steps.macsign.outcome == 'success'
        run: |
          for app in dist/mac*/MrTerminal.app; do
            echo "== $app"
            codesign --verify --deep --strict --verbose=2 "$app"
            codesign -dv "$app" 2>&1 | grep -q 'TeamIdentifier=${{ secrets.APPLE_TEAM_ID }}'
            xcrun stapler validate "$app"
            spctl --assess --type execute -vv "$app" 2>&1 | tee /dev/stderr | grep -q 'source=Notarized Developer ID'
          done
      - name: Smoke test packaged Linux app
        if: matrix.platform == 'linux'
        run: xvfb-run -a node scripts/smoke-packaged.cjs dist/linux-unpacked/mrterminal
      - name: Smoke test packaged macOS app
        if: matrix.platform == 'mac'
        # The runner's login shell is bash 3.2, which can't report exit codes;
        # zsh is the macOS default.
        env:
          SHELL: /bin/zsh
        run: node scripts/smoke-packaged.cjs dist/mac-arm64/MrTerminal.app/Contents/MacOS/MrTerminal
      - name: Smoke test packaged Windows app
        if: matrix.platform == 'win'
        run: node scripts/smoke-packaged.cjs dist/win-unpacked/MrTerminal.exe
      - uses: actions/upload-artifact@v4
        with:
          name: MrTerminal-${{ matrix.platform }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: MrTerminal-*
          path: release
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" release/* --verify-tag --title "MrTerminal $GITHUB_REF_NAME" --generate-notes
