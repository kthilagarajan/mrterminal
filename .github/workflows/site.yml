name: Website

# Builds site/ (Astro) and publishes it with GitHub Pages. Runs when the site,
# the agent skill, the config schema, the CLI's command list or the
# screenshots change on main. Needs Settings → Pages → Source: GitHub Actions.
on:
  push:
    branches: [main]
    paths:
      - site/**
      - skills/**
      - schema/**
      - src/cli/commands.ts
      - docs/screenshots/**
      - assets/icon.svg
      - .github/workflows/site.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
        working-directory: site
      - run: npm run build
        working-directory: site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
