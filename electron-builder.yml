appId: com.webtkdev.mrterminal
productName: MrTerminal
directories:
  output: dist
  buildResources: build
files:
  - out/**
  - package.json
# node-pty uses N-API: prebuilds on macOS/Windows, a local build on Linux.
# npm ci builds the Linux module; it also works in Electron without a rebuild.
npmRebuild: false
# node-pty executes a helper binary, which has to live outside the asar archive.
asarUnpack:
  - node_modules/node-pty/**
mac:
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch: [arm64, x64]
    # The in-app updater downloads this one.
    - target: zip
      arch: [arm64, x64]
  darkModeSupport: true
  # The `mrt` command: a launcher that runs out/main/cli.js on the app's own
  # Node. "Install 'mrt' Command…" links /usr/local/bin/mrt to it.
  extraResources:
    - from: resources/bin
      to: bin
  artifactName: ${productName}-${version}-${arch}.${ext}
  # Signed with the Developer ID Application certificate (CSC_LINK in CI, or
  # the login keychain locally) and notarized when APPLE_API_KEY,
  # APPLE_API_KEY_ID and APPLE_API_ISSUER are set. Builds without the
  # certificate (pull requests) override this to an ad hoc signature; see
  # .github/workflows/release.yml.
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
linux:
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  category: Development
  maintainer: kthilagarajan <kthilagarajan@users.noreply.github.com>
  artifactName: ${productName}-${version}-linux-${arch}.${ext}
win:
  target:
    - target: nsis
      arch: [x64]
  artifactName: ${productName}-${version}-win-${arch}-setup.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
